name: CI

# On a pull request this runs by itself. On main it runs as the first job of
# release.yml (workflow_call), so a merge is tested once and the release waits
# for it — a second, separate run on push would only duplicate the work.
on:
  pull_request:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json promises (engines.node); 24 is what the
        # maintainers run. Both, so a break on either shows up here.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile is written by whatever npm a maintainer runs locally (11.x).
      # Node 20 bundles npm 10, whose resolver builds a different tree — it then
      # rejects that lockfile outright ("Missing: @emnapi/runtime from lock file")
      # and `npm ci` fails on a repo that is perfectly fine. Pin npm so the
      # resolver is the same everywhere, whatever Node version is under test.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Pack the build, unpack it, and start the bin once the way npx does.
      # Releases 1.0.0 to 1.1.0 shipped a bin without the execute bit, and every
      # Axonity MCP failed with "Connection closed"; this turns a PR red first.
      - run: npm run smoke:bin
