name: Contract drift

# Every drift guard in this repository reads test/fixtures/openapi.snapshot.json,
# which makes them exactly as fresh as the last time a person remembered to run
# `dump_openapi.py`. They did not remember: the snapshot sat nine operations
# behind axonity-flow@main, `conformance.test.ts` was green throughout, and two
# of those nine were the routes #45 M7 was built on (axonity-mcp#48 M1).
#
# A snapshot that has not seen a route cannot report it missing. The guard is
# sound; its input was manual. This is the input.
#
# It runs on a schedule rather than only on a PR because the thing that changes
# is the OTHER repository — nothing happens here on the day the backend adds a
# route, which is exactly the day we want to hear about it.

on:
  schedule:
    # 06:15 UTC on weekdays — before the working day, after an overnight deploy.
    # A drifted contract found at 06:15 is a morning's work; found at release
    # time it is a blocked release.
    - cron: "15 6 * * 1-5"
  workflow_dispatch:
    inputs:
      ref:
        description: "axonity-flow ref to compare against (default: main)"
        required: false
        default: "main"

# A second run while the first is still going tells you nothing new.
concurrency:
  group: contract-drift
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the connector
        uses: actions/checkout@v4

      # Fail EARLY and in the RIGHT words.
      #
      # The first version of this step only checked that the secret was
      # non-empty, and said "not set" when the secret was set perfectly well and
      # the token behind it lacked a Contents grant. A guard that names the wrong
      # cause costs more than no guard: it sends you to fix something that was
      # never broken. So this asks the API what the token can actually do, and
      # distinguishes the three ways it goes wrong — which is also what makes an
      # EXPIRED token, a year from now, diagnose itself in one line.
      - name: Check the token can read axonity-flow
        env:
          TOKEN: ${{ secrets.AXONITY_FLOW_READ_TOKEN }}
        run: |
          set -u
          if [ -z "${TOKEN}" ]; then
            echo "::error::AXONITY_FLOW_READ_TOKEN is not set."
            echo "axonity-flow is private, so this job needs a token that can read it."
            echo "Add a repository secret of that name. See axonity-mcp#48 M1."
            exit 1
          fi

          api() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/$1"
          }

          repo=$(api "repos/AxonityAI/axonity-flow")
          # Metadata alone is enough to see the repo. Reading a FILE is the
          # permission the checkout actually needs, so that is what is probed.
          contents=$(api "repos/AxonityAI/axonity-flow/contents/backend/scripts/dump_openapi.py")
          echo "repo=${repo} contents=${contents}"

          if [ "${repo}" = "200" ] && [ "${contents}" = "200" ]; then
            echo "Token can read axonity-flow."
            exit 0
          fi

          echo "::error::AXONITY_FLOW_READ_TOKEN cannot read AxonityAI/axonity-flow."
          if [ "${repo}" = "401" ]; then
            echo "401: the token is invalid, revoked, or EXPIRED. Mint a new one."
          elif [ "${repo}" = "200" ]; then
            echo "The repository is visible but its files are not (contents=${contents})."
            echo "The token is missing the 'Contents: Read-only' repository permission."
            echo "Note that 'Metadata: Read-only' is granted automatically and is NOT enough."
          else
            echo "The token cannot see the repository at all (repo=${repo})."
            echo "Two usual causes, in order:"
            echo "  1. It is PENDING organisation approval. An AxonityAI owner approves it at"
            echo "     https://github.com/organizations/AxonityAI/settings/personal-access-token-requests"
            echo "  2. Its resource owner is a personal account rather than AxonityAI, or"
            echo "     axonity-flow is not in its selected repositories."
            echo "Check the token at https://github.com/settings/personal-access-tokens"
          fi
          exit 1

      - name: Check out axonity-flow
        uses: actions/checkout@v4
        with:
          repository: AxonityAI/axonity-flow
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.AXONITY_FLOW_READ_TOKEN }}
          path: axonity-flow

      - uses: actions/setup-python@v5
        with:
          # The backend declares requires-python >= 3.13; importing the app on an
          # older runtime fails in ways that look like drift and are not.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: axonity-flow/backend/requirements.txt

      - name: Install the backend's dependencies
        working-directory: axonity-flow/backend
        # dump_openapi.py imports the FastAPI app, so the app's imports must
        # resolve. It does NOT open a database connection — that is stated in the
        # script's own docstring and is why this job needs no services.
        run: pip install -r requirements.txt

      - name: Dump the live schema
        working-directory: axonity-flow/backend
        run: python scripts/dump_openapi.py -o "$GITHUB_WORKSPACE/fresh.json"

      - name: Compare against the vendored snapshot
        run: node scripts/check-contract-drift.mjs --fresh fresh.json

      # Only reached when the step above failed. `if: failure()` on a step that
      # writes the summary keeps the diff in the run's own page rather than only
      # in a log a person has to expand.
      - name: Explain the failure in the run summary
        if: failure()
        run: |
          {
            echo "## The vendored OpenAPI snapshot is stale"
            echo
            echo "\`test/fixtures/openapi.snapshot.json\` no longer matches"
            echo "\`axonity-flow@${{ github.event.inputs.ref || 'main' }}\`."
            echo "Every drift guard in this repository reads that file, so they are"
            echo "currently checking against a contract the backend no longer serves."
            echo
            echo "Refresh it from an axonity-flow checkout on the target commit:"
            echo
            echo '```bash'
            echo "python backend/scripts/dump_openapi.py \\"
            echo "  -o <axonity-mcp>/test/fixtures/openapi.snapshot.json"
            echo '```'
            echo
            echo "Then run \`npm test\` and reconcile whatever the guards report."
            echo "See the **Compare** step above for the operations that moved,"
            echo "and axonity-mcp#48 for why this job exists."
          } >> "$GITHUB_STEP_SUMMARY"
