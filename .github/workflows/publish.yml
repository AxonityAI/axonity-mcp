name: Publish to npm

# Publishes @axonity-ai/mcp when a GitHub Release is published. Cut a release
# whose tag matches the package version (e.g. v0.1.0) and this ships it.
#
# Requires an NPM_TOKEN repo secret with WRITE access to @axonity-ai/mcp. A
# token without it fails here as `E404 ... PUT` — npm answers 404 rather than
# 403 so it does not leak whether a package exists. Prefer a granular access
# token: classic automation tokens that bypass 2FA are being restricted for
# direct publishing.
#
# Note this checks out the RELEASE TAG, not main — a fix landed on main after
# the tag was cut is not in this build. Re-tag or cut a new release.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # Same npm pin as ci.yml — Node 20 bundles npm 10, which rejects a
      # lockfile written by npm 11. Keep the two workflows in step.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # prepublishOnly builds; publishConfig makes it public.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
