name: Verify release

# Publishing is done by a maintainer from their machine (`npm publish` after
# `npm login`), NOT from CI. npm restricts tokens that bypass 2FA for direct
# publishing, so a stored NPM_TOKEN cannot ship this package — a CI publish step
# would only ever fail and paint every release red.
#
# This workflow instead proves the TAG is shippable: it builds and tests the
# exact commit the release points at, and packs the tarball without sending it.
# That is a real guard — v0.3.1 was tagged with a lockfile CI could not install,
# and nothing caught it until the release already existed.
on:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same npm pin as ci.yml — keep the resolver identical everywhere.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Builds the tarball exactly as `npm publish` would, and stops there.
      - run: npm pack --dry-run
